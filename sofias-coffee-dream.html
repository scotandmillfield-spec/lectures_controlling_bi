<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Once upon a time · Sofia's Coffee Dream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#209CBD; --teal-dk:#166980; --teal-lt:#5FBBD3; --teal-xl:#E6F4F8;
  --orange:#FF922B; --orange-xl:#FFF1E0;
  --ochre:#B5852C; --ochre-xl:#F7EFDF;
  --navy:#0F4C5C; --navy-xl:#E4EFF3;
  --sand:#F0E0C3; --sand-xl:#FAF4E9;
  --ink:#1D1D1F; --grey:#8A8A89; --grey-mid:#C9C9C7; --grey-xl:#EDEDEC;
  --paper:#FFFFFF; --shell:#FBF8F2; --canvas:#F4F3F0;
  --green:#2E9E6B; --red:#D9534F;
  --sans:"Source Sans 3","Source Sans Pro",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
  --shadow:0 1px 2px rgba(29,29,31,.05), 0 8px 24px -12px rgba(22,105,128,.22);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--shell);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 72px}

.masthead{padding:52px 0 26px;border-bottom:1px solid var(--grey-xl)}
.topbar{display:flex;gap:18px;align-items:center;margin:0 0 18px}
.topbar .eyebrow{margin:0;flex:1;min-width:0}
.langsw{display:inline-flex;border:1px solid var(--grey-xl);background:var(--paper);
  border-radius:20px;padding:3px;gap:3px;flex:none}
.langsw a{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.1em;
  color:var(--grey);text-decoration:none;padding:6px 12px;border-radius:20px;transition:.16s}
.langsw a:hover{color:var(--teal-dk)}
.langsw a[aria-current="true"]{background:var(--teal-dk);color:#fff}
.langsw a:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:var(--teal-dk);display:flex;align-items:center;gap:10px;margin:0 0 18px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--grey-xl)}
h1{font-size:clamp(2rem,4.6vw,3.2rem);font-weight:700;letter-spacing:-.026em;line-height:1.05;margin:0 0 14px;max-width:20ch}
h1 em{font-style:normal;color:var(--teal)}
.lede{font-size:clamp(1rem,1.6vw,1.18rem);font-weight:300;color:#3d3d40;max-width:64ch;margin:0}

.tabs{display:flex;gap:8px;margin:34px 0 0;flex-wrap:wrap}
.tab{appearance:none;border:1px solid var(--grey-xl);background:var(--paper);
  font-family:var(--sans);font-size:.95rem;font-weight:600;color:var(--grey);
  padding:13px 20px;border-radius:var(--r);cursor:pointer;display:flex;align-items:baseline;gap:10px;
  transition:border-color .18s,color .18s,background .18s,transform .18s var(--ease)}
.tab .num{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;opacity:.7}
.tab:hover{border-color:var(--teal);color:var(--teal-dk);transform:translateY(-1px)}
.tab[aria-selected="true"]{background:var(--teal-dk);border-color:var(--teal-dk);color:#fff}
.tab:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.panel{padding-top:28px}
.panel[hidden]{display:none}

.claim{font-size:clamp(1.12rem,2.2vw,1.45rem);font-weight:300;line-height:1.36;margin:0 0 24px;max-width:58ch;color:#2c2c2f}
.claim b{font-weight:600;color:var(--teal-dk)}
h2.sec{font-size:1.2rem;font-weight:600;letter-spacing:-.012em;margin:34px 0 4px}
p.sub{margin:0 0 16px;color:var(--grey);font-size:.92rem;max-width:76ch}
.hint{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);margin:14px 0 0}

/* ---------- Sofia speech ---------- */
.say{display:grid;grid-template-columns:104px 1fr;gap:18px;align-items:center;margin-bottom:26px}
.say>*{min-width:0}
.sofia{width:104px;height:150px;flex:none}
.bubble{position:relative;background:var(--paper);border:1.5px solid var(--grey-mid);
  border-radius:22px;padding:22px 26px;box-shadow:var(--shadow)}
.bubble::before,.bubble::after{content:"";position:absolute;left:-13px;top:50%;
  width:0;height:0;border:11px solid transparent;border-right-color:var(--grey-mid);
  transform:translateY(-50%)}
.bubble::after{left:-10px;border-right-color:var(--paper)}
.bubble .hey{font-size:1.05rem;font-weight:700;color:var(--orange);letter-spacing:.02em;margin:0 0 6px}
.bubble p{margin:0;font-size:clamp(1.1rem,2.4vw,1.5rem);font-weight:300;line-height:1.28;color:var(--ink)}
.bubble .who{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--grey);margin-top:12px}

/* ---------- the loop ---------- */
.stage{background:var(--paper);border:1px solid var(--grey-xl);border-radius:var(--r);
  box-shadow:var(--shadow);padding:14px 10px 6px;overflow-x:auto}
svg#loop{width:100%;max-width:620px;margin:0 auto;height:auto;display:block}
.node{cursor:help}
.node .hit{fill:transparent}
.node:focus-visible{outline:none}
.node:hover .ring,.node:focus-visible .ring{opacity:1}
.ring{fill:none;stroke:var(--teal-dk);stroke-width:2.5;opacity:0;transition:opacity .18s;pointer-events:none}
svg#loop text{font-family:var(--sans);fill:var(--ink);pointer-events:none;dominant-baseline:middle}
#loop .t-n{font-size:13.5px;font-weight:600}
#loop .t-s{font-size:10.5px;fill:#5a5a5c}
#loop .t-c{font-size:12px;fill:var(--grey);font-style:italic}
.arc{fill:none;stroke:#B9B9B7;stroke-width:1.8}

/* ---------- value chain ---------- */
.chain{display:grid;grid-template-columns:repeat(4,1fr);gap:0;align-items:stretch}
.chain>*{min-width:0}
.stationwrap{display:flex;align-items:stretch;min-width:0}
.station{background:var(--paper);border:1px solid var(--grey-xl);border-radius:var(--r);
  padding:16px 17px;cursor:help;flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;
  position:relative;overflow:hidden;
  transition:border-color .18s,transform .2s var(--ease),box-shadow .2s}
.station::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--st,var(--teal))}
.station:hover,.station:focus-visible{transform:translateY(-3px);box-shadow:var(--shadow);
  border-color:transparent;outline:none}
.station .sk{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey)}
.station h3{margin:0;font-size:1rem;font-weight:700;letter-spacing:-.012em;line-height:1.2}
.station p{margin:0;font-size:.82rem;color:#4a4a4d;line-height:1.4}
.station .tagrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.station .tagrow span{font-family:var(--mono);font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;
  background:var(--teal-xl);color:var(--teal-dk);border-radius:4px;padding:3px 6px}
.arrow{display:flex;align-items:center;justify-content:center;width:26px;flex:none;color:var(--grey-mid)}
.arrow svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4}

/* ---------- pain cards ---------- */
.pains{display:grid;gap:10px;max-width:900px}
.pain{background:var(--teal-dk);color:#fff;border-radius:var(--r);padding:16px 20px;cursor:help;
  display:flex;align-items:baseline;gap:14px;min-width:0;
  transition:transform .2s var(--ease),box-shadow .2s,background .2s}
.pain:hover,.pain:focus-visible{transform:translateX(4px);box-shadow:var(--shadow);outline:none}
.pain .pn{font-family:var(--mono);font-size:.7rem;opacity:.66;flex:none}
.pain .pt{font-size:1.02rem;font-weight:600;line-height:1.3;min-width:0}
.pain.p2{background:#2E9CBB} .pain.p3{background:#6EC0D4} .pain.p3 .pt,.pain.p3 .pn{color:#0F3D4A}
.pain.p4{background:#9AD4E2} .pain.p4 .pt,.pain.p4 .pn{color:#0F3D4A}
.pains .pain:nth-child(1){margin-right:0}
.pains .pain:nth-child(2){margin-left:26px}
.pains .pain:nth-child(3){margin-left:52px}
.pains .pain:nth-child(4){margin-left:78px}

/* ---------- people ---------- */
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.person{background:var(--paper);border:1px solid var(--grey-xl);border-radius:var(--r);
  padding:18px 19px;cursor:help;min-width:0;position:relative;overflow:hidden;
  transition:border-color .18s,transform .2s var(--ease),box-shadow .2s}
.person::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--pc,var(--teal))}
.person:hover,.person:focus-visible{transform:translateY(-3px);box-shadow:var(--shadow);border-color:transparent;outline:none}
.person .pk{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);margin-bottom:6px}
.person h3{margin:0 0 5px;font-size:1.08rem;font-weight:700;letter-spacing:-.015em}
.person .role{font-size:.84rem;color:var(--teal-dk);font-weight:600;margin:0 0 8px}
.person p{margin:0;font-size:.85rem;color:#4a4a4d;line-height:1.45}

/* ---------- the 10 000 case ---------- */
.case{background:var(--paper);border:1px solid var(--grey-xl);border-radius:var(--r);
  box-shadow:var(--shadow);padding:20px 22px;margin-top:14px}
.casebar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:18px}
.casebar .ct{font-size:1.05rem;font-weight:700;letter-spacing:-.015em;min-width:0}
.seg{display:inline-flex;border:1px solid var(--grey-xl);background:var(--canvas);border-radius:var(--r);padding:4px;gap:4px}
.seg button{appearance:none;border:0;background:transparent;cursor:pointer;font-family:var(--sans);
  font-size:.86rem;font-weight:600;color:var(--grey);padding:9px 15px;border-radius:7px;transition:.16s}
.seg button:hover{color:var(--teal-dk)}
.seg button[aria-pressed="true"]{background:var(--teal-dk);color:#fff}
.seg button:focus-visible{outline:2px solid var(--orange);outline-offset:-2px}

.chart{display:grid;gap:14px;margin-bottom:16px}
.brow{display:grid;grid-template-columns:130px 1fr 104px;gap:12px;align-items:center;min-width:0;cursor:help}
.brow>*{min-width:0}
.brow .bl{font-size:.9rem;font-weight:600;line-height:1.2}
.brow .bl small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--grey);font-weight:400;margin-top:2px}
.brow .btrack{height:34px;background:var(--canvas);border-radius:4px;overflow:hidden;position:relative}
.brow .btrack i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--teal);
  transition:width .55s var(--ease),background .3s}
.brow.lead .btrack i{background:var(--orange)}
.brow .bv{font-family:var(--mono);font-size:1rem;font-weight:600;font-variant-numeric:tabular-nums;
  text-align:right;color:var(--ink);white-space:nowrap}
.brow:hover .btrack i{filter:brightness(1.05)}
.brow .lead-flag{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
  color:#A85B00;display:block;margin-top:3px;opacity:0}
.brow.lead .lead-flag{opacity:1}

.verdict{border-radius:8px;padding:14px 16px;font-size:.95rem;line-height:1.5;
  background:var(--sand-xl);border:1px solid #E8DDC6}
.verdict b{font-weight:700}
.verdict .amt{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}

.tscroll{overflow-x:auto;margin-top:14px;border:1px solid var(--grey-xl);border-radius:8px}
table.tbl{width:100%;min-width:520px;border-collapse:collapse;font-size:.85rem}
table.tbl th{background:#F7F7F5;text-align:left;padding:9px 12px;font-family:var(--mono);
  font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);
  border-bottom:1px solid var(--grey-mid);white-space:nowrap}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--grey-xl)}
table.tbl tr:last-child td{border-bottom:0}
table.tbl td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.tbl tr.sum td{font-weight:700;background:var(--teal-xl)}

.learned{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.lc{background:var(--canvas);border:1px solid var(--grey-xl);border-radius:8px;padding:14px 15px;min-width:0}
.lc .lk{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--grey);margin-bottom:6px}
.lc p{margin:0;font-size:.86rem;color:#3d3d40;line-height:1.45}

/* ---------- detail panel & boxes ---------- */
.detail{margin-top:16px;background:var(--paper);border:1px solid var(--grey-xl);border-radius:var(--r);
  box-shadow:var(--shadow);padding:22px 24px;min-height:150px}
.detail .dk{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--teal-dk);margin:0 0 8px}
.detail h4{margin:0 0 10px;font-size:1.16rem;font-weight:700;letter-spacing:-.015em}
.detail p{margin:0 0 10px;font-size:.96rem;color:#3d3d40;max-width:82ch}
.detail p:last-child{margin-bottom:0}
.detail .warn{color:#B25E00;font-weight:600}
.detail .fig{font-family:var(--mono);font-size:.86rem;background:var(--teal-xl);color:var(--teal-dk);
  border-radius:5px;padding:5px 9px;display:inline-block}

.readme{margin-top:20px;background:var(--teal-dk);color:#fff;border-radius:var(--r);padding:20px 24px;
  font-size:1rem;line-height:1.55}
.readme.warn{background:var(--orange)}
.readme b{font-weight:700}
.readme code{font-family:var(--mono);font-size:.86em;background:rgba(255,255,255,.2);padding:1px 5px;border-radius:4px}
.readme a{color:#fff;text-decoration:underline;text-underline-offset:3px}

.maprow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.mp{background:var(--paper);border:1px solid var(--grey-xl);border-radius:8px;padding:12px 13px;
  min-width:0;text-decoration:none;display:block;transition:.2s}
.mp .mk{font-family:var(--mono);font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--grey);display:block;margin-bottom:5px}
.mp b{display:block;font-size:.88rem;font-weight:600;color:var(--ink);line-height:1.25}
.mp span.d{font-size:.78rem;color:var(--grey);display:block;margin-top:4px;line-height:1.35}
.mp:hover,.mp:focus-visible{background:var(--teal-dk);border-color:var(--teal-dk);outline:none}
.mp:hover b,.mp:focus-visible b,.mp:hover span.d,.mp:focus-visible span.d{color:#fff}
.mp:hover .mk,.mp:focus-visible .mk{color:#8FD4E6}
.mp.soon{cursor:default;opacity:.62}
.mp.soon:hover{background:var(--paper);border-color:var(--grey-xl)}
.mp.soon:hover b{color:var(--ink)} .mp.soon:hover span.d{color:var(--grey)} .mp.soon:hover .mk{color:var(--grey)}

.pointe{margin-top:34px;background:var(--orange);color:#fff;border-radius:var(--r);padding:26px 28px}
.pointe .pk{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.78);margin:0 0 10px}
.pointe p{margin:0;font-size:clamp(1.05rem,2vw,1.3rem);font-weight:300;line-height:1.42;max-width:66ch}
.pointe p b{font-weight:700}

footer{margin-top:36px;font-size:.82rem;color:var(--grey);line-height:1.6;
  border-top:1px solid var(--grey-xl);padding-top:20px}
footer a{color:var(--teal-dk)}

.tip{position:fixed;z-index:60;pointer-events:none;opacity:0;transform:translateY(4px);
  transition:opacity .14s,transform .14s;background:var(--ink);color:#fff;border-radius:9px;
  padding:12px 14px;font-size:.82rem;line-height:1.5;max-width:310px;box-shadow:0 10px 30px -8px rgba(0,0,0,.45)}
.tip.on{opacity:1;transform:translateY(0)}
.tip .th{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:#8FD4E6;margin:0 0 5px}
.tip p{margin:0}
.tip .extra{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.18);
  color:var(--orange);font-weight:600}

@media (max-width:960px){
  .chain{grid-template-columns:1fr 1fr}
  .people,.learned,.maprow{grid-template-columns:1fr 1fr}
  .pains .pain{margin-left:0!important}
}
@media (max-width:620px){
  .wrap{padding:0 16px 56px}
  .chain,.people,.learned,.maprow{grid-template-columns:1fr}
  .say{grid-template-columns:1fr}
  .sofia{margin:0 auto}
  .brow{grid-template-columns:1fr;gap:6px}
  .brow .bv{text-align:left}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="wrap">

<header class="masthead">
  <div class="topbar">
    <p class="eyebrow" data-t="eyebrow"></p>
    <nav class="langsw" id="langsw" aria-label="Sprache · Language">
      <a data-lang="de">DE</a><a data-lang="en">EN</a>
    </nav>
  </div>
  <h1 data-t="h1"></h1>
  <p class="lede" data-t="lede"></p>
</header>

<div class="tabs" role="tablist" aria-label="Sofia's Coffee Dream">
  <button class="tab" role="tab" id="tab-a" aria-controls="p-a" aria-selected="true"><span class="num">01</span> <span data-t="tabA"></span></button>
  <button class="tab" role="tab" id="tab-b" aria-controls="p-b" aria-selected="false" tabindex="-1"><span class="num">02</span> <span data-t="tabB"></span></button>
  <button class="tab" role="tab" id="tab-c" aria-controls="p-c" aria-selected="false" tabindex="-1"><span class="num">03</span> <span data-t="tabC"></span></button>
  <button class="tab" role="tab" id="tab-d" aria-controls="p-d" aria-selected="false" tabindex="-1"><span class="num">04</span> <span data-t="tabD"></span></button>
</div>

<!-- ============================ TAB A ============================ -->
<section class="panel" id="p-a" role="tabpanel" aria-labelledby="tab-a">
  <div class="say">
    <svg class="sofia" viewBox="0 0 104 150" aria-hidden="true">
      <g fill="none" stroke="#1D1D1F" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="46" cy="34" r="20"/>
        <path d="M31 20 q15 -12 30 0"/>
        <path d="M64 20 q10 -4 9 8 q-1 8 -8 7"/>
        <circle cx="39" cy="33" r="2.6" fill="#1D1D1F"/>
        <circle cx="53" cy="33" r="2.6" fill="#1D1D1F"/>
        <path d="M38 42 q8 7 16 0"/>
        <path d="M46 54 L46 96"/>
        <path d="M46 96 L36 130 M46 96 L58 130"/>
        <ellipse cx="33" cy="136" rx="8" ry="5"/>
        <ellipse cx="61" cy="136" rx="8" ry="5"/>
        <path d="M46 62 L26 84" /><ellipse cx="23" cy="88" rx="5" ry="7"/>
        <path d="M46 62 L72 44" /><ellipse cx="76" cy="40" rx="5" ry="7"/>
      </g>
      <path d="M46 58 L28 108 L64 108 Z" fill="#B7E8A6" stroke="#1D1D1F" stroke-width="2.1" stroke-linejoin="round"/>
      <path d="M46 54 L46 58" stroke="#1D1D1F" stroke-width="2.1"/>
    </svg>
    <div class="bubble">
      <p class="hey" data-t="hey"></p>
      <p data-t="wish"></p>
      <p class="who" data-t="who"></p>
    </div>
  </div>

  <p class="claim" data-t="claimA"></p>
  <h2 class="sec" data-t="secLoop"></h2>
  <p class="sub" data-t="subLoop"></p>

  <div class="stage">
    <svg id="loop" viewBox="0 0 620 400" role="img" data-ta="loopAria"></svg>
  </div>

  <div class="detail" id="detA"></div>

  <h2 class="sec" data-t="secBegin"></h2>
  <p class="sub" data-t="subBegin"></p>
  <div class="readme" data-t="boxBike"></div>
  <p class="hint" data-t="hintA"></p>
</section>

<!-- ============================ TAB B ============================ -->
<section class="panel" id="p-b" role="tabpanel" aria-labelledby="tab-b">
  <p class="claim" data-t="claimB"></p>
  <div class="chain" id="chain"></div>
  <div class="detail" id="detB"></div>
  <div class="readme warn" data-t="boxLoopBiz"></div>
  <h2 class="sec" data-t="secMap"></h2>
  <p class="sub" data-t="subMap"></p>
  <div class="maprow" id="maprow"></div>
  <p class="hint" data-t="hintB"></p>
</section>

<!-- ============================ TAB C ============================ -->
<section class="panel" id="p-c" role="tabpanel" aria-labelledby="tab-c">

 lede:{de:"Vor den Sternschemata und den Scorecards steht ein Mensch mit einer Idee, einem Fahrrad und einer daraufgeschnallten Espressomaschine. Dieses Modul erzählt diese Geschichte — wer Sofia ist, wie das Geschäft gewachsen ist, warum die Art, es zu führen, nicht mehr trägt, und was an dem Tag geschah, an dem sie ein Diagramm zu schnell gelesen hat. Nichts anderes in der Bibliothek hängt davon ab: zeigen, wenn der Raum einen Fall braucht, sonst weglassen.",

       en:['Why start here','Every figure in this library measures one hop of this loop',

 secBegin:{de:"Wo es angefangen hat", en:"Where it began"},
 subBegin:{de:"Nicht mit einem Laden. Mit einem Fahrrad, einer Espressomaschine und einem grünen Sonnenschirm.",
           en:"Not with a shop. With a bicycle, an espresso machine and a green umbrella."},
 boxBike:{de:"<b>Das Coffeebike ist der älteste Teil des Geschäfts, nicht der jüngste.</b> Alles andere ist daraus gewachsen: das erste Kaffeehaus, weil die Schlange am Rad zu lang wurde; die Rösterei, weil gekaufte Bohnen bedeuten, dass jemand anderes über den Geschmack entscheidet; der Großhandel, weil die Rösterei Kapazität übrig hatte. Diese Reihenfolge zählt, wenn man später auf die Daten schaut — das Rad ist der einzige Verkaufsort ohne feste Adresse, und es steht in der Standortdimension, weil es zuerst da war, nicht weil jemand einen Sonderfall gesucht hat.",
          en:"<b>The coffee bike is the oldest part of the business, not the newest.</b> Everything else grew out of it: the first coffee house because the queue at the bike got too long, the roastery because buying roasted beans meant somebody else decided how they tasted, the wholesale line because the roastery had capacity left over. That order matters when you look at the data later — the bike is the only sales point with no fixed address, and it is in the location dimension because it was there first, not because someone wanted an edge case."},

         en:"Four stations, one bean. <b>Every module in this library plugs in somewhere along this line</b> — hover a station to see what happens there and which session covers it."},
 detB:{de:['Die Wertschöpfungskette','Von einer Kooperative in Peru bis zur Tasse an der Ringstraße',
   'Von links nach rechts gelesen ist es eine Lieferkette. Als Datenproblem gelesen sind es vier Systeme, die nichts voneinander wissen: eine Importdatei, ein Röstprotokoll, eine Kasse und ein Großhandels-Auftragsbuch. Jedes nennt ein Kilogramm Kaffee anders, und zwei von ihnen sind sich nicht einmal einig, was ein Kunde ist.',
   'Fahren Sie über eine Station: Rolle, Zahlen und das Modul, das sie behandelt.'],
       en:['The value chain','From a cooperative in Peru to a cup on the Ringstraße',
   'Read left to right and it is a supply chain. Read it as a data problem and it is four systems that do not know about each other: an import file, a roasting log, a till, and a wholesale order book. Every one of them calls a kilogram of coffee something different, and two of them are not even sure what a customer is.',
   'Hover any station for its role, its figures and the module that covers it.']},
 boxLoopBiz:{de:"<b>Die Schleife, auf die es sich zu zeigen lohnt.</b> Sofia verkauft geröstete Bohnen an sieben Bäckereien — und kauft Kuchen und Gebäck bei Bäckereien, teils bei denselben. Dieselbe Geschäftsbeziehung erscheint einmal als Kunde und einmal als Lieferant, unter zwei verschiedenen Nummern, in zwei verschiedenen Systemen. Niemand hat das geplant; so sieht es aus, wenn ein Betrieb dadurch wächst, dass er ja sagt. Es ist zugleich das sauberste Beispiel des ganzen Falls dafür, warum Stammdaten eine Disziplin sind und keine Tabelle.",
             en:"<b>The loop worth pointing at.</b> Sofia sells roasted beans to seven bakeries — and buys her cake and pastry from bakeries, partly the same ones. The same business relationship appears once as a customer and once as a supplier, under two different numbers, in two different systems. Nobody planned this; it is what happens when a business grows by saying yes. It is also the cleanest example in the whole case of why master data is a discipline and not a spreadsheet."},

 claimC:{de:"Das Geschäft ist gewachsen. Die Art, es zu führen, nicht. Vier Sätze aus Sofias eigener Bestandsaufnahme — und sie <b>steigern sich</b>, das ist der Teil, den man bemerken sollte.",
         en:"The business grew. The way it is run did not. Four sentences from Sofia's own stocktake — and they <b>escalate</b>, which is the part worth noticing."},

   'Fahren Sie über jede Zeile, um zu sehen, was sie in Sofias Woche bedeutet.'],
       en:['Reading the list','These are not four problems. They are one problem and three symptoms.',
   'Pen and paper is the cause. The tax advisor owning the numbers is the consequence — if nobody inside the business can produce a figure, somebody outside will, on their own schedule. Falling revenue and rising complaints are what that looks like from the outside, months later, when it is expensive to fix.',
   "Hover each line for what it actually means in Sofia's week."]},
 boxTax:{de:"<b>Der Steuerberater ist nicht der Bösewicht.</b> Seine Zahlen sind korrekt, vollständig und prüfungsfest — und sie kommen zehn Wochen nach Quartalsende. Für das Finanzamt ist das genau richtig und für eine Entscheidung am Dienstagmorgen unbrauchbar. Die Trennlinie zwischen beidem ist die Linie, die Reichmann durch seine Pyramide zieht: Abrechnungssysteme sind kein Controlling, sie sind die Etage, auf der Controlling steht. Die Theorie zu Sofias Klage steht im Modul <a href='controlling-pyramid.html$QS'>Controlling-Pyramide</a>.",
         en:"<b>The tax advisor is not the villain.</b> His figures are correct, complete and auditable — and they arrive ten weeks after the quarter ends. That is exactly right for the tax office and useless for a decision on a Tuesday morning. The line between the two is the line Reichmann draws through his pyramid: accounting systems are not controlling, they are the floor controlling stands on. If you want the theory behind Sofia's complaint, it is in the <a href='controlling-pyramid.html$QS'>Controlling Pyramid</a> module."},

 boxDiag:{de:"<b>Sofia arbeitet nicht zu wenig. Sie arbeitet mehr Stunden als je zuvor.</b> Die Zahlen, die sie braucht, existieren bereits — die Kasse schreibt jede Zeile, der Röster protokolliert jede Charge, das ERP kennt jeden Sack aus Peru. Sie liegen nur an vier Stellen, in vier Formen, und sind drei Wochen alt, bis sie jemand zusammenzählt. Das ist kein Fleißproblem und kein Softwareproblem. Es ist das Problem, um das es in diesem ganzen Kurs geht.",
          en:"<b>Sofia does not work too little. She works more hours than she ever has.</b> The figures she needs already exist — the till writes every line, the roaster logs every batch, the ERP knows every sack from Peru. They are simply in four places, in four shapes, and three weeks old by the time anyone adds them up. That is not an effort problem and it is not a software problem. It is the problem this entire course is about."},

 detD:{de:['Das Zweigespann','Sofia ist nicht die Dumme — sie ist die Ungeduldige',

 boxNothing:{de:"<b>Nichts war kaputt.</b> Keine Zahl war falsch, kein Bon ging verloren, und das Quartal summierte sich in beiden Berichten auf 145 500 €. Anna ist am 1. März von der Ringstraße nach Alsergrund gewechselt, und der erste Bericht schrieb ihr ganzes Quartal stillschweigend dorthin, wo sie heute arbeitet. Sofia las das als Wachstum in Alsergrund und steckte 10 000 € in eine Campus-Kampagne für das Haus, das nicht gewachsen war. Die Theorie hinter den beiden Berichten — und warum die Summe gleich bleibt, die Wahrheit aber nicht — steht im Modul <a href='scd-dashboard.html$QS'>Slowly Changing Dimensions</a>.",
             en:"<b>Nothing was broken.</b> No figure was wrong, no receipt was lost, and the quarter added up to 145 500 € in both reports. Anna simply moved from Ringstraße to Alsergrund on 1 March, and the first report quietly credited her whole quarter to wherever she happens to work today. Sofia read that as growth in Alsergrund and put 10 000 € into a campus campaign for the house that had not grown. The theory behind the two reports — and why the sum stays the same while the truth does not — is the <a href='scd-dashboard.html$QS'>Slowly Changing Dimensions</a> module."},
 secLearn:{de:"Was Sofia mitgenommen hat", en:"What Sofia took away"},

 pointe:{de:"<b>Sofia wollte nie ein Dashboard. Sie wollte ihre Nachmittage zurück.</b> Jedes Modell, jedes Sternschema und jede Scorecard in dieser Bibliothek existiert aus einem Grund: damit die Antwort eine Minute dauert statt vierzehn Tage — und damit sie es eines Tages endlich sagen und auch so meinen kann. <em>Gut, dann radle ich jetzt zum Markusplatz.</em>",

/* =====================================================================

const tip = document.getElementById("tip");
const LIVE = {"p-a":["detA","detA"], "p-b":["detB","detB"], "p-c":["detC","detC"], "p-d":["detD","detD"]};
const KICK = {"p-a":{de:"Station des Kreislaufs",en:"Station of the loop"},
              "p-b":{de:"Wertschöpfungskette",en:"Value chain"},
              "p-c":{de:"Schmerzpunkt",en:"Pain point"},
              "p-d":{de:"Die Beteiligten",en:"The cast"}};

function show(elem, ev){
  const d = REG[elem.dataset.k]; if(!d) return;
  const t0=L(d[0]), t1=L(d[1]), t2=d[2]?L(d[2]):"";
  tip.innerHTML = `<p class="th">${t0}</p><p>${t1}</p>` + (t2?`<p class="extra">${t2}</p>`:"");
  tip.classList.add("on");
  move(elem, ev);
  const panel = elem.closest(".panel");
  if(panel && LIVE[panel.id]){
    document.getElementById(LIVE[panel.id][0]).innerHTML =
      `<p class="dk">${L(KICK[panel.id])}</p><h4>${t0}</h4><p>${t1}</p>` +
      (t2?`<p><span class="fig">${t2}</span></p>`:"");
  }
}
function move(elem, ev){
  let x,y;
  if(ev && ev.clientX){ x = ev.clientX+16; y = ev.clientY+16; }
  else { const r = elem.getBoundingClientRect(); x = r.left + r.width/2; y = r.top - 8; }
  const w = tip.offsetWidth, h = tip.offsetHeight;
  if(x+w > innerWidth-12) x = innerWidth-w-12;
  if(y+h > innerHeight-12) y = y-h-32;
  if(y < 8) y = 8;
  if(x < 8) x = 8;
  tip.style.left = x+"px"; tip.style.top = y+"px";
}
function hideTip(){ tip.classList.remove("on"); }

const SEL = "[data-k]";
document.addEventListener("pointerover", e=>{const n=e.target.closest&&e.target.closest(SEL); if(n) show(n,e);});
document.addEventListener("pointermove", e=>{const n=e.target.closest&&e.target.closest(SEL); if(n) move(n,e);});
document.addEventListener("pointerout", e=>{
  const from=e.target.closest&&e.target.closest(SEL); if(!from) return;
  const to=e.relatedTarget&&e.relatedTarget.closest?e.relatedTarget.closest(SEL):null;
  if(to!==from) hideTip();
});
document.addEventListener("focusin", e=>{const n=e.target.closest&&e.target.closest(SEL); if(n) show(n,null);});
document.addEventListener("focusout", e=>{if(e.target.closest&&e.target.closest(SEL)) hideTip();});
addEventListener("scroll", hideTip, {passive:true});

/* =====================================================================
   Der Kreislauf
   ===================================================================== */
(function buildLoop(){
  const NS="http://www.w3.org/2000/svg";
  const svg=document.getElementById("loop");
  const el=(n,a={})=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const add=(p,n,a)=>{const e=el(n,a);p.appendChild(e);return e;};
  const defs=add(svg,"defs");
  const m=add(defs,"marker",{id:"la",viewBox:"0 0 10 10",refX:"8",refY:"5",
    markerWidth:"5.5",markerHeight:"5.5",orient:"auto-start-reverse"});
  add(m,"path",{d:"M0,1 L9,5 L0,9 z",fill:"#B9B9B7"});

  const CX=310, CY=200, R=126, NR=58;
  const NODES=[
    ["beans", -90, {de:"Grüne Bohnen",en:"Green beans"}, {de:"Peru · fair gehandelt",en:"Peru · fair trade"}],
    ["roast",   0, {de:"Die Rösterei",en:"The roastery"}, {de:"12 kg · −16 %",en:"12 kg · −16 %"}],
    ["cup",    90, {de:"Die Tasse",en:"The cup"}, {de:"Theke · Rad · Sack",en:"counter · bike · sack"}],
    ["back",  180, {de:"Sie kommen wieder",en:"They come back"}, {de:"oder eben nicht",en:"or they don't"}]
  ];
  const rad = d => d*Math.PI/180;
  const px = (a,r) => [CX + r*Math.cos(rad(a)), CY + r*Math.sin(rad(a))];

  NODES.forEach(([,a],i)=>{
    const b = NODES[(i+1)%NODES.length][1];
    const [x1,y1] = px(a+27, R);
    const [x2,y2] = px((a===180 ? 270 : b)-27, R);
    add(svg,"path",{class:"arc",d:`M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${R} ${R} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`,
      "marker-end":"url(#la)"});
  });

  NODES.forEach(([id,a,nameV,subV])=>{
    const [x,y] = px(a, R);
    const name=L(nameV), sub=L(subV);
    const g = add(svg,"g",{class:"node",tabindex:"0",role:"button","data-k":id,"aria-label":L(REG[id][0])});
    add(g,"circle",{cx:x,cy:y,r:NR,fill:"#E6F4F8",stroke:"#209CBD","stroke-width":1.6});
    const words=name.split(" ");
    if(words.length>2){
      const t1=add(g,"text",{x:x,y:y-8,"text-anchor":"middle",class:"t-n"});
      t1.textContent=words.slice(0,2).join(" ");
      const t1b=add(g,"text",{x:x,y:y+7,"text-anchor":"middle",class:"t-n"});
      t1b.textContent=words.slice(2).join(" ");
      const t2=add(g,"text",{x:x,y:y+24,"text-anchor":"middle",class:"t-s"}); t2.textContent=sub;
    } else {
      const t1=add(g,"text",{x:x,y:y-8,"text-anchor":"middle",class:"t-n"}); t1.textContent=name;
      const t2=add(g,"text",{x:x,y:y+12,"text-anchor":"middle",class:"t-s"}); t2.textContent=sub;
    }
    add(g,"circle",{class:"ring",cx:x,cy:y,r:NR+5});
    add(g,"circle",{class:"hit",cx:x,cy:y,r:NR+3});
  });

  const mid=L({de:["den Kreis am","Laufen halten"],en:["keep the circle","turning"]});
  const c1=add(svg,"text",{x:CX,y:CY-11,"text-anchor":"middle",class:"t-c"}); c1.textContent=mid[0];
  const c2=add(svg,"text",{x:CX,y:CY+9,"text-anchor":"middle",class:"t-c"}); c2.textContent=mid[1];
})();

const VERDICT={
 t1:{de:`<b>Alsergrund liegt mit 13 500 € vorn</b> — ein Fünftel vor der Ringstraße. Sofias Lesart: Das Campus-Haus hebt ab, und die Studierenden sind die Zukunft. Ihre Entscheidung noch am selben Nachmittag: <span class="amt">10 000 €</span> in eine Semesterkampagne für Alsergrund.`,
