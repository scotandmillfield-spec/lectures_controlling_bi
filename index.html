<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weiche · Entwicklung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#209CBD; --teal-dk:#166980; --teal-lt:#5FBBD3; --teal-xl:#E6F4F8;
  --orange:#FF922B; --orange-xl:#FFF1E0;
  --ochre:#B5852C; --ochre-xl:#F7EFDF;
  --navy:#0F4C5C; --navy-xl:#E4EFF3;
  --sand:#F0E0C3; --sand-xl:#FAF4E9;
  --green:#2E9E6B; --red:#D9534F;
  --ink:#1D1D1F; --grey:#8A8A89; --grey-mid:#C9C9C7; --grey-xl:#EDEDEC;
  --paper:#FFFFFF; --shell:#FBF8F2;
  --r:12px;
  --shadow:0 1px 2px rgba(29,29,31,.05), 0 8px 24px -12px rgba(22,105,128,.22);
  --lift:0 2px 4px rgba(29,29,31,.05), 0 22px 44px -20px rgba(22,105,128,.45);
  --sans:"Source Sans 3","Source Sans Pro",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--shell);color:var(--ink);font-family:var(--sans);
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:0 24px 64px}
.hinweis{margin:0 -24px 40px;background:var(--orange);color:#fff;
  padding:13px 24px;font-family:var(--mono);font-size:.76rem;letter-spacing:.08em;
  text-transform:uppercase}
header{padding:44px 0 8px}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--grey);margin:0 0 14px}
h1{font-size:clamp(2rem,5vw,2.9rem);line-height:1.08;letter-spacing:-.025em;font-weight:700;margin:0 0 14px}
h1 em{font-style:normal;color:var(--teal)}
.lede{font-size:1.1rem;color:#3d3d40;margin:0 0 40px;max-width:62ch}
/* auto-fit statt einer festen Spaltenzahl: die Kacheln richten sich nach der
   Zahl der Einstiege, ohne dass hier etwas nachgezogen werden muss. Bei 860px
   Breite passen drei nebeneinander. */
.tore{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:18px}
.tore>*{min-width:0}
.tor{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:var(--paper);
  border:1px solid var(--grey-xl);border-radius:var(--r);box-shadow:var(--shadow);
  padding:26px 26px 24px;border-top:3px solid var(--acc);
  transition:transform .28s var(--ease),box-shadow .28s var(--ease),border-color .2s}
.tor:hover,.tor:focus-visible{transform:translateY(-4px);box-shadow:var(--lift)}
.tor:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
.tk{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--grey);margin:0 0 9px}
.tor h2{font-size:1.35rem;letter-spacing:-.015em;margin:0 0 8px;font-weight:600}
.tor p{margin:0 0 14px;color:#3d3d40;font-size:.96rem;line-height:1.6}
.tor ul{margin:0;padding-left:19px;color:var(--grey);font-size:.88rem;line-height:1.7}
/* Unten ausgerichtet, damit die Pfadzeilen aller Kacheln auf einer Hoehe stehen. */
.pfad{font-family:var(--mono);font-size:.74rem;color:var(--acc);margin:auto 0 0;padding-top:18px}
footer{margin-top:46px;font-size:.82rem;color:var(--grey);line-height:1.6;
  border-top:1px solid var(--grey-xl);padding-top:20px}
.build{font-family:var(--mono);font-size:.92em;letter-spacing:.02em;opacity:.85}
@media (max-width:640px){ .wrap{padding:0 16px 56px} .hinweis{margin:0 -16px 32px;padding:13px 16px} }
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="wrap">

<p class="hinweis">Nur für die Entwicklung — diese Seite wird nie ausgeliefert</p>

<header>
  <p class="eyebrow">Controlling Innovations Center</p>
  <h1>Die <em>controllinge.de | Lernplattform</em></h1>
  <p class="lede">Wähle den allgemeinen oder den speziellen Teil für Deine Lernerfahrung</p>
</header>

<div class="tore" id="tore"></div>

</div>

<footer>Copyright Prof. Dr. Maik Drozdzynski, 2026 · <span class='build'>build 0.0.52</span>
</footer>

</div>

<script>
/* =====================================================================
   DIE EINSTIEGE

   Ein Einstieg ist ein Verzeichnis mit einer eigenen index.html, einer
   eigenen reihenfolge.js und den Modulen, die zu ihm gehoeren. Er wird
   fuer sich hochgeladen und verweist auf keinen anderen.

   Ein neuer Einstieg kostet hier eine Zeile. Wie viele es sind, ist der
   Liste gleich; die Kacheln richten sich selbst aus.

   ordner : das Verzeichnis, zugleich der Verweis auf seine Startseite
   name   : die Ueberschrift der Kachel
   was    : ein Satz darueber, fuer wen der Einstieg da ist
   punkte : zwei bis drei Stichworte, was drinsteht
   akzent : die Farbe der oberen Kante, aus dem :root-Block
   ===================================================================== */
const EINSTIEGE = [
  {ordner:"vorlesung", name:"Vorlesung", akzent:"var(--teal-dk)",
   was:"Der Stoff f\u00fcr meine Studenten, zusammengehalten von einem durchgehenden Fall: zwei Wiener Kaffeeh\u00e4user, eine R\u00f6sterei, ein Coffeebike.",
   punkte:["Business Intelligence, Controlling, Fallstudie", "Foliens\u00e4tze unter <code>decks/</code>"]},
  {ordner:"plattform", name:"Lernplattform", akzent:"var(--orange)",
   was:"Module zum Selbststudium, unabh\u00e4ngig von einer Veranstaltung und in eigener Ansprache.",
   punkte:["Bilanzanalyse, Liquidit\u00e4tsplanung, Risikomanagement", "Die Werkstatt f\u00fcr alle, die Inhalte beisteuern"]},
  {ordner:"cv-mx", name:"CV MX", akzent:"var(--navy)",
   was:"Der Bereich f\u00fcr den CV, einen Verband der Pflege und sozialen Dienste. Eigener Fall, eigene Ansprache, eigene Auslieferung.",
   punkte:["Das Controlling-Leitbild", "Weitere Module des Pfades folgen"]}
];

/* Die Kachel ist ein Verweis. Die Pfadzeile steht unten ueber
   margin:auto, damit sie in allen Kacheln auf einer Hoehe liegt, auch
   wenn der Text darueber verschieden lang ist. */
const esc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

document.getElementById("tore").innerHTML = EINSTIEGE.map(e =>
  `<a class="tor" href="${e.ordner}/index.html" style="--acc:${e.akzent}">
     <p class="tk">Verzeichnis ${esc(e.ordner)}/</p>
     <h2>${esc(e.name)}</h2>
     <p>${e.was}</p>
     <ul>${e.punkte.map(p => `<li>${p}</li>`).join("")}</ul>
     <p class="pfad">${esc(e.ordner)}/index.html</p>
   </a>`).join("");
</script>

</body>
</html>
